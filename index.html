<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Комуналка</title>
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Комуналка">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #0E1116; --bar: #12151C; --surface: #151922; --surface2: #1C212C; --line: #252B38;
  --text: #E9EDF5; --muted: #8B94A7; --faint: #5A6275; --accent: #7C8CFF;
  --water: #4FB3FF; --light: #FFC15A; --osbb: #A78BFA; --heat: #FF7A6B;
  --good: #4ADE80; --warn: #F5A524; --bad: #F87171;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; }

#screen { padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 96px); max-width: 640px; margin: 0 auto; }
.page { animation: pageIn .32s cubic-bezier(.2,.8,.2,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { opacity: 0; animation: rise .45s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.head { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
.head h1 { font-size: 30px; font-weight: 650; margin: 0; letter-spacing: -.4px; }
.head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.head .grow { flex: 1; min-width: 0; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--surface2); }
.icon-btn.ok { color: var(--good); } .icon-btn.err { color: var(--bad); }
.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
.card.tap { transition: transform .12s, background .2s; }
.card.tap:active { transform: scale(.985); background: var(--surface2); }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.hint { color: var(--faint); font-size: 12px; margin-top: 2px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.right { text-align: right; }
.b { font-weight: 600; }
.sep { height: 1px; background: var(--line); margin: 10px 0; }
.tag { display: inline-block; background: var(--surface2); color: var(--muted); font-size: 11px; border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; }
.tag.good { color: var(--good); } .tag.warn { color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 14px;
  background: var(--accent); color: #0B0D12; font-weight: 600; font-size: 16px; transition: transform .1s, filter .2s; }
.btn:active { transform: scale(.97); filter: brightness(.92); }
.btn.secondary { background: var(--surface2); color: var(--text); font-weight: 500; }
.btn.danger { background: transparent; color: var(--bad); font-weight: 500; }
.btn svg { width: 20px; height: 20px; }
.mb { margin-bottom: 12px; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.kpis .card { margin: 0; padding: 15px; }
.kpi-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.kpi-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); display: grid; place-items: center; flex: none; }
.kpi-ic svg { width: 16px; height: 16px; }
.kpi-val { font-size: 20px; font-weight: 650; margin: 12px 0 3px; white-space: nowrap; letter-spacing: -.3px; }
.kpi-sub { font-size: 11px; }

.seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
.seg button { padding: 5px 11px; border-radius: 7px; color: var(--muted); font-size: 13px; transition: background .2s, color .2s; }
.seg button.on { background: var(--surface2); color: var(--text); }
.chart { width: 100%; height: 220px; display: block; margin-top: 12px; touch-action: manipulation; }
.chart .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.chart.grown .bar { transform: scaleY(1); }
.chart text { fill: var(--faint); font-size: 10px; }
.chart text.sel { fill: var(--text); }
.line { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.line .lbl { flex: 1; color: var(--muted); }
.line.total .val { font-size: 17px; font-weight: 650; }
.line.accent .val { color: var(--accent); }

.list-row { display: flex; align-items: center; gap: 10px; }
.list-row .main { flex: 1; min-width: 0; }
.list-row .title { font-size: 16px; font-weight: 600; }
.small { font-size: 12px; } .tiny { font-size: 11px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.fab { position: fixed; right: max(18px, calc(50vw - 302px)); bottom: calc(var(--safe-bottom) + 84px); height: 54px; padding: 0 20px 0 16px; border-radius: 17px;
  background: var(--accent); color: #0B0D12; font-weight: 600; display: flex; align-items: center; gap: 8px; z-index: 5;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: transform .12s; animation: rise .4s .15s backwards; }
.fab:active { transform: scale(.95); }
.fab[hidden] { display: none; }
.fab svg { width: 22px; height: 22px; }

nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 8px 4px calc(var(--safe-bottom) + 6px); z-index: 10; }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 11px; transition: color .2s; }
nav button .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .25s; }
nav button svg { width: 22px; height: 22px; }
nav button.on { color: var(--text); }
nav button.on .pill { background: var(--surface2); color: var(--accent); }

.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet.open { transform: none; }
.sheet-inner { padding: calc(var(--safe-top) + 8px) 16px calc(var(--safe-bottom) + 30px); max-width: 640px; margin: 0 auto; }
.sheet-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font-size: 21px; font-weight: 650; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 3px; }
.field input { width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text);
  padding: 0 14px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,140,255,.18); }
.field input.bad { border-color: var(--bad); }
.field input::placeholder { color: var(--faint); }
.field .help { font-size: 12px; color: var(--faint); margin: 5px 0 0 3px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sec { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; margin: 16px 0 10px; }
.sec svg { width: 18px; height: 18px; }
.calc { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin: 6px 0 14px; }
.err { color: var(--bad); font-size: 13px; min-height: 0; margin: 4px 0 10px; }

.switch { display: flex; align-items: center; gap: 12px; padding: 10px 0 14px; }
.switch .grow { flex: 1; }
.tog { width: 52px; height: 32px; border-radius: 16px; background: var(--surface2); position: relative; transition: background .25s; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.tog.on { background: var(--accent); } .tog.on::after { transform: translateX(20px); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { position: relative; height: 70px; border-radius: 12px; background: var(--surface); overflow: hidden; padding: 11px 12px; text-align: left; }
.tile .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--heat); transition: height .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
.tile span { position: relative; display: block; }
.tile .pct { font-size: 17px; font-weight: 650; }
.section-title { font-size: 17px; font-weight: 600; margin: 22px 0 2px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 92px); transform: translate(-50%, 20px); opacity: 0; background: #262C3A;
  border: 1px solid #363E50; border-radius: 20px; padding: 10px 18px; font-size: 14px; z-index: 30; transition: opacity .25s, transform .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
a { color: var(--accent); }
</style>
</head>
<body>
<main id="screen"></main>
<button class="fab" id="fab" hidden></button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
